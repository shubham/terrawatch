[versions]
kotlin = "2.2.20"
composeMultiplatform = "1.9.0"
agp = "8.10.1"
ktor = "3.2.2"
sqldelight = "2.1.0"
koin = "4.1.0"
kotlinxSerialization = "1.9.0"
kotlinxCoroutines = "1.10.2"
kotlinxDatetime = "0.7.1"
turbine = "1.2.1"
androidxActivity = "1.10.1"
androidxLifecycle = "2.9.1"
# Plan 4 Task 3: androidx.work:work-runtime-ktx. Checked Google's Maven repo's own
# maven-metadata.xml directly (2026-08-15, not trusting the plan's own "2.10.x" placeholder as an
# exact patch) — same "verify against the real index" discipline navigationCompose's own version
# choice already established. Full 2.10.x line: 2.10.0 ... 2.10.5 (alpha/beta/rc precede 2.10.0);
# 2.10.5 is the newest stable patch within the 2.10 line the plan explicitly names — a newer 2.11.x
# stable line also exists, but the plan names "2.10.x" twice (tech-stack line + this task's own
# dispatch), read as a deliberate compatibility target rather than a vague guess, so this stays
# within that line rather than jumping to the newest overall stable.
androidxWork = "2.10.5"
maplibreCompose = "0.14.0"
# Task 13: androidTest-only. androidx.test:runner latest stable per Maven Central/Google (checked
# 2026-08-09) is 1.7.0 (Jul 2025) — bumped from the brief's placeholder 1.6.2 per its own "bump to
# current stable" instruction. ui-test-manifest deliberately NOT pinned to compose multiplatform's
# own composeMultiplatform version (1.9.0) — it's a plain androidx.compose.ui artifact (the
# instrumented-test placeholder-activity manifest fragment has no multiplatform equivalent) and its
# own version line moves independently; 1.8.3 is the brief's own figure and is what this project's
# compose.uiTest accessor resolves alongside without a conflict (verified via a real
# androidDebugAndroidTestCompileClasspath resolution — see task-13-report.md).
androidxTestRunner = "1.7.0"
androidxComposeUiTestManifest = "1.8.3"
# Task 4 (Plan 3): the JetBrains KMP fork of AndroidX Navigation Compose. Checked Maven Central's
# own maven-metadata.xml directly (2026-08-09) rather than trusting this plan's own placeholder
# ("~2.8.x"): the full version list runs 2.7.0-alpha03 ... 2.9.0(-alpha/beta/rc)... 2.9.1, 2.9.2,
# 2.10.0-alpha01/02 — i.e. 2.9.2 is the latest STABLE release, with 2.10.0-alpha02 newer but
# pre-release. Picked 2.9.2 over the newer alpha: this is production app code, not a library
# tracking bleeding-edge APIs, and nothing this task needs requires anything past stable. Also
# confirmed (via that version's own .module Gradle metadata) that 2.9.2 publishes a real
# `wasmJsApiElements` variant alongside `androidJvm`/`jvm`(desktop) — i.e. all three of this
# project's targets resolve a real platform artifact, not just "the KMP group exists."
navigationCompose = "2.9.2"
# Plan 4 Task 4 (c): the JetBrains KMP-published Material3 Adaptive library
# (org.jetbrains.compose.material3.adaptive) — checked its real maven-metadata.xml on Maven Central
# directly (2026-08-15, same "verify against the real index" discipline navigationCompose/
# androidxTestRunner's own entries already establish): the full version list runs
# 1.0.0-alpha01...1.0.1, 1.1.0-alpha01...1.1.2, 1.2.0-alpha01...1.2.0-beta01, 1.2.0,
# 1.3.0-alpha01...1.3.0-beta02 — i.e. 1.2.0 is the latest STABLE release, with 1.3.0 currently
# beta-only. Also confirmed this exact version is what Compose Multiplatform 1.9.x itself pins
# (kotlinlang.org's own 1.9 release notes: "Compose Material3 Adaptive libraries
# org.jetbrains.compose.material3.adaptive:adaptive*:1.2.0, based on Jetpack Material3 Adaptive
# 1.2.0") — this project's own composeMultiplatform = "1.9.0" above, so 1.2.0 is the version this
# Compose runtime was actually built/tested against, not an independently-chosen number. Confirmed
# a real android + desktop + wasmJs artifact all publish at 1.2.0 (adaptive-layout, desktop
# variant "adaptive-layout-desktop", wasmJs variant "adaptive-layout-wasm-js" — checked each
# maven-metadata.xml directly) — all three of this project's targets resolve a real platform
# artifact, matching navigationCompose's own verification precedent.
material3Adaptive = "1.2.0"
# Plan 4 Task 6: RevenueCat's Kotlin Multiplatform SDK — checked Maven Central's own
# maven-metadata.xml directly (2026-08-15, same "verify against the real index" discipline
# navigationCompose/material3Adaptive/androidxWork's own entries above already establish): the
# version list runs 1.0.0-beta.1...1.9.0, 2.0.0...2.10.2, 3.0.0-beta.1...3.5.0 — i.e. 3.5.0 is the
# latest STABLE release (both the <release> and <latest> tags agree, no newer beta/rc beyond it).
# core:monetization's androidMain depends on `purchases-kmp-core` ONLY (this task's own brief:
# "purchases-kmp deps ANDROID-GATED (androidMain)") — jvm/wasmJs stay on AlwaysFreeEntitlements per
# the Android-only runtime scope directive already in force since Plan 4 Task 4, so neither needs
# this artifact on its classpath at all. `purchases-kmp-ui` (the Compose Multiplatform paywall UI)
# is deliberately NOT added yet — Task 6's own Settings "TerraWatch Plus" row is a static STUB
# screen (no RevenueCat account/product exists to power a real paywall against), and the plan's own
# dispatch text names that wiring explicitly as "Task 8 when key exists."
revenueCatPurchasesKmp = "3.5.0"
# Plan 4 Task 6: play-services-ads (AdMob) — checked Google's own Maven repo (dl.google.com)
# maven-metadata.xml directly (2026-08-15): 119 versions on file, 25.4.0 is the latest (both
# <release>/<latest> tags agree), last published June 2026.
playServicesAds = "25.4.0"
# feat/feed-visit-ux, "Splash app name": androidx.core:core-splashscreen — the AndroidX compat
# library for the Android 12+ SplashScreen API (needed back to minSdk 26, not just 31+, same
# "compat back to this app's real floor" reasoning every other AndroidX pin here already follows).
# Checked dl.google.com's own maven-metadata.xml directly (2026-08-16, same discipline as every
# other version pin in this file): full list runs 1.0.0-alpha01/02, 1.0.0-beta01/02, 1.0.0-rc01,
# 1.0.0, 1.0.1, 1.1.0-alpha01/02, 1.1.0-rc01, 1.2.0-alpha01/02, 1.2.0-beta01/02, 1.2.0-rc01, 1.2.0 —
# i.e. 1.2.0 is the latest STABLE release (both <release>/<latest> tags agree).
coreSplashscreen = "1.2.0"

[libraries]
# Task 4 (c): currentWindowAdaptiveInfo()/WindowSizeClass live in the CORE "adaptive" artifact (not
# "adaptive-layout", which adds pane-scaffold layout strategies — ListDetailPaneScaffold etc. —
# this app doesn't need) — confirmed against the real dependency sample on kotlinlang.org's own
# "Adaptive layouts" doc page (`implementation("org.jetbrains.compose.material3.adaptive:adaptive:
# ...")`).
material3-adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "material3Adaptive" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-webworker-driver = { module = "app.cash.sqldelight:web-worker-driver", version.ref = "sqldelight" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinxCoroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
# Plan 4 Task 3: LocalLifecycleOwner + resume-observation for the alerts permission UI (Settings'
# ALERTS row / onboarding step 3 must reflect a permission change made in system Settings while
# this app was merely paused, not restarted) — the JetBrains KMP-published artifact under the SAME
# group/version this project's own lifecycle-viewmodel-compose already pins, not a second,
# independently-versioned lifecycle dependency (checked Maven Central: 2.9.1 is a real published
# version of this artifact too, alongside 2.9.2/2.11.0 — kept at 2.9.1 for consistency with the
# other lifecycle artifact already in use here rather than bumping only this one).
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "androidxWork" }
maplibre-compose = { module = "org.maplibre.compose:maplibre-compose", version.ref = "maplibreCompose" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "androidxComposeUiTestManifest" }
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
revenuecat-purchases-kmp-core = { module = "com.revenuecat.purchases:purchases-kmp-core", version.ref = "revenueCatPurchasesKmp" }
play-services-ads = { module = "com.google.android.gms:play-services-ads", version.ref = "playServicesAds" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }

