name: CI
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'docs/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (core + app)
        run: ./gradlew :core:model:jvmTest :core:network:jvmTest :core:database:jvmTest :core:data:jvmTest :core:ui:jvmTest :core:monetization:jvmTest :core:ads:jvmTest :composeApp:jvmTest :core:database:verifySqlDelightMigration
      # Note: connected Android device tests run locally (docs/qa/)
      - name: Build all targets
        run: ./gradlew :composeApp:assembleDebug :composeApp:jvmJar :composeApp:wasmJsBrowserDistribution
