name: Release to Play

# Deliberate releases only: a version tag (v1.0.0) or a manual dispatch.
# Never fires on ordinary pushes/merges — ci.yml owns those.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track to upload to'
        required: true
        default: 'internal'
        type: choice
        options: [internal, beta]

concurrency:
  group: play-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Check release secrets exist
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$KS" ] || [ -z "$SA" ]; then
            echo "::error::Release secrets missing. Required: UPLOAD_KEYSTORE_B64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD, PLAY_SERVICE_ACCOUNT_JSON, REVENUECAT_API_KEY, ADMOB_APP_ID, ADMOB_BANNER_UNIT. See docs/superpowers/plans/2026-08-17-play-ci-deployment.md"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Materialize signing + monetization config
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_UNIT: ${{ secrets.ADMOB_BANNER_UNIT }}
        run: |
          # Strip ALL whitespace before decoding. macOS `base64` wraps its output at 76 columns,
          # and a clipboard round-trip can add stray CR/LF, either of which makes GNU `base64 -d`
          # abort with a bare "invalid input" that says nothing about the real cause. Tolerating
          # whitespace here costs nothing and removes a whole class of confusing release failures.
          printf '%s' "$UPLOAD_KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/upload.jks"
          # Fail LOUDLY and specifically if the secret was truncated. A short/corrupt keystore
          # otherwise surfaces much later as an opaque Gradle signing error.
          ks_size=$(wc -c < "$RUNNER_TEMP/upload.jks")
          if [ "$ks_size" -lt 1000 ]; then
            echo "::error::Decoded keystore is only ${ks_size} bytes - UPLOAD_KEYSTORE_B64 is truncated or not a keystore. Re-set it with: base64 -i <keystore>.jks | tr -d '\n' | gh secret set UPLOAD_KEYSTORE_B64"
            exit 1
          fi
          {
            echo "REVENUECAT_API_KEY=$REVENUECAT_API_KEY"
            echo "ADMOB_APP_ID=$ADMOB_APP_ID"
            echo "ADMOB_BANNER_UNIT=$ADMOB_BANNER_UNIT"
          } > composeApp/monetization.properties

      - name: Unit tests
        run: ./gradlew jvmTest :core:database:verifySqlDelightMigration

      - name: Build signed AAB
        env:
          CI_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          CI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # versionCode = run_number + offset so it always exceeds manually-uploaded codes and
        # rises monotonically across CI runs. Offset chosen at first CI release; bump if a
        # manual upload ever outruns it.
        run: ./gradlew :composeApp:bundleRelease -PciVersionCode=$((10 + GITHUB_RUN_NUMBER))

      - name: Upload to Play
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.yugma.terrawatch
          releaseFiles: composeApp/build/outputs/bundle/release/composeApp-release.aab
          track: ${{ github.event_name == 'push' && 'beta' || inputs.track }}
          status: completed
          mappingFile: composeApp/build/outputs/mapping/release/mapping.txt

      - name: Attach AAB to run
        uses: actions/upload-artifact@v4
        with:
          name: terrawatch-aab
          path: composeApp/build/outputs/bundle/release/composeApp-release.aab
          retention-days: 30
