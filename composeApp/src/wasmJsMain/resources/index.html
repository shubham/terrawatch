<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TerraWatch</title>
    <style>
        html, body, #app {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        /* ComposeViewport injects a <canvas> into #app; without an explicit size it
           renders at its intrinsic size instead of filling the viewport. */
        #app canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
    <script src="composeApp.js"></script>
</head>
<body>
<div id="app"></div>
</body>
</html>
